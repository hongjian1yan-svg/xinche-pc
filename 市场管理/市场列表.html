<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场列表 - 智慧车市</title>
<style>
  :root{
    --primary:#409EFF;
    --success:#67C23A;
    --warning:#E6A23C;
    --danger:#F56C6C;
    --text-primary:#303133;
    --text-regular:#606266;
    --text-secondary:#909399;
    --text-placeholder:#C0C4CC;
    --border-base:#DCDFE6;
    --border-light:#EBEEF5;
    --border-lighter:#F2F6FC;
    --bg-page:#F2F4F5;
    --fill-light:#F5F7FA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    font-size:14px;
    color:var(--text-primary);
    background:var(--bg-page);
    min-width:1200px;
  }

  /* ===================== 整体布局 ===================== */
  .layout-container{display:flex;height:100vh;background:var(--bg-page);min-width:1200px;}

  /* ===================== 侧边栏 ===================== */
  .sidebar{width:180px;flex-shrink:0;background:#FFFFFF;box-shadow:2px 0 8px rgba(29,35,41,0.05);height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
  .sidebar::-webkit-scrollbar{width:6px;}
  .sidebar::-webkit-scrollbar-thumb{background:#C0C4CC;border-radius:4px;}
  .logo{height:90px;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid var(--border-lighter);flex-shrink:0;}
  .logo-icon{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#48528e,#409EFF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:18px;}
  .logo-text{font-size:20px;color:#0444a6;font-weight:400;}
  .menu{padding:8px 0;}
  .menu-item{display:flex;align-items:center;height:56px;padding:0 20px;font-size:14px;color:#66798c;cursor:pointer;transition:background .2s,color .2s;}
  .menu-item:hover{background:#f2f7ff;color:#409eff;}
  .menu-item .arrow{margin-left:auto;font-size:12px;transition:transform .2s;color:#c0c4cc;}
  .menu-item.expanded .arrow{transform:rotate(90deg);}
  .submenu{overflow:hidden;}
  .submenu-item{height:56px;line-height:56px;padding:0 20px 0 44px;font-size:14px;color:#66798c;cursor:pointer;transition:background .2s,color .2s;}
  .submenu-item:hover{background:#f2f7ff;color:#409eff;}
  .submenu-item.active{background:#48528e;color:#FFFFFF;}

  /* ===================== 顶部状态栏 ===================== */
  .main-area{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;}
  .top-header{height:60px;flex-shrink:0;background:#FFFFFF;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
  .market-info{font-size:14px;color:#333333;font-weight:600;}
  .user-profile{display:flex;align-items:center;gap:12px;}
  .role-switcher{font-size:12px;color:var(--text-regular);border:1px solid var(--border-base);border-radius:4px;padding:4px 8px;cursor:pointer;background:#fff;}
  .avatar{width:30px;height:30px;border-radius:50%;background:#48528e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
  .username{font-size:16px;color:#000000;font-weight:600;}
  .role-tag{background:#d0e2f2;color:#1d2c4f;height:20px;line-height:20px;padding:0 8px;border-radius:4px;font-size:12px;white-space:nowrap;}
  .dropdown-arrow{width:20px;height:20px;border-radius:4px;background:#f3f5fc;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:12px;cursor:pointer;}

  /* ===================== 主内容区 ===================== */
  .main-content{flex:1;padding:15px;background:var(--bg-page);overflow:auto;}
  .content-body{background:#f9fafb;min-height:100%;padding:20px 12px;}

  /* ===================== 筛选区 ===================== */
  .search-filter-container{background:#F2F2F2;padding:20px 12px;}
  .filter-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 24px;}
  .filter-item{display:inline-flex;align-items:center;}
  .filter-label{width:80px;flex-shrink:0;text-align:right;margin-right:12px;font-size:14px;color:var(--text-regular);}
  .filter-actions{width:100%;display:flex;margin-left:0;gap:12px;margin-bottom:0;}

  /* ===================== 表单控件 ===================== */
  .ipt,.sel-display{height:40px;line-height:38px;padding:0 12px;font-size:14px;color:var(--text-primary);background:#FFFFFF;border:1px solid var(--border-base);border-radius:4px;outline:none;transition:border-color .2s;width:200px;}
  .ipt:hover,.sel-display:hover{border-color:#C0C4CC;}
  .ipt:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(64,158,255,.1);}
  .ipt::placeholder{color:var(--text-placeholder);}
  .custom-select{position:relative;width:200px;}
  .custom-select .sel-display{width:100%;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .custom-select .sel-display.placeholder{color:var(--text-placeholder);}
  .custom-select .sel-arrow{color:var(--text-placeholder);font-size:12px;transition:transform .2s;}
  .custom-select.open .sel-arrow{transform:rotate(180deg);}
  .custom-select.open .sel-display{border-color:var(--primary);}
  .select-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border-light);border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.1);max-height:260px;overflow-y:auto;z-index:50;display:none;}
  .custom-select.open .select-panel{display:block;}
  .select-option{padding:0 16px;height:34px;line-height:34px;font-size:14px;color:var(--text-primary);cursor:pointer;}
  .select-option:hover{background:#F5F7FA;}
  .select-option.selected{background:#F5F7FA;color:var(--primary);font-weight:bold;}

  /* ===================== 按钮 ===================== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:32px;padding:0 15px;font-size:14px;border-radius:4px;cursor:pointer;border:1px solid var(--border-base);background:#fff;color:var(--text-regular);min-width:64px;white-space:nowrap;transition:all .2s;}
  .btn:hover{color:var(--primary);border-color:#c6e2ff;background:#ecf5ff;}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn-primary:hover{background:#66b1ff;border-color:#66b1ff;color:#fff;}
  .btn-small{height:24px;padding:0 12px;font-size:12px;min-width:0;}
  .btn-large{height:40px;padding:0 19px;font-size:14px;}

  /* ===================== 日期范围 ===================== */
  .date-range{display:flex;align-items:center;gap:6px;height:40px;border:1px solid var(--border-base);border-radius:4px;background:#fff;padding:0 10px;width:320px;}
  .date-range input{border:none;outline:none;font-size:14px;color:var(--text-primary);width:110px;text-align:center;}
  .date-range input::placeholder{color:var(--text-placeholder);}
  .date-range-icon{font-size:13px;color:var(--text-placeholder);}
  .date-range-sep{color:var(--text-placeholder);}

  /* ===================== 表格 ===================== */
  .table-wrap{margin-top:20px;background:#fff;border:1px solid var(--border-light);border-radius:4px;overflow:hidden;}
  table.data-table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .data-table th{background:#F5F7FA;color:var(--text-secondary);font-size:14px;font-weight:bold;text-align:center;height:54px;padding:0 8px;border-bottom:1px solid var(--border-light);border-right:1px solid var(--border-light);}
  .data-table th:last-child,.data-table td:last-child{border-right:none;}
  .data-table td{height:54px;text-align:center;padding:8px;font-size:14px;color:var(--text-primary);border-bottom:1px solid var(--border-light);border-right:1px solid var(--border-light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .data-table tbody tr:hover td{background:#F5F7FA;}

  /* ===================== 状态标签 ===================== */
  .status-tag{display:inline-block;padding:2px 10px;font-size:12px;border-radius:4px;line-height:20px;}
  .status-tag.success{background:#f0f9eb;color:#67C23A;border:1px solid #e1f3d8;}
  .status-tag.info{background:#f4f4f5;color:#909399;border:1px solid #e9e9eb;}

  /* ===================== 操作按钮 ===================== */
  .market-op-btns{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .more-op{position:relative;}
  .more-op .more-op-btn{height:32px;padding:0 12px;font-size:13px;background:#fff;border:1px solid var(--border-base);border-radius:4px;color:var(--text-regular);cursor:pointer;display:flex;align-items:center;gap:4px;}
  .more-op .more-op-btn:hover{color:var(--primary);border-color:#b3d8ff;}
  .more-op .more-op-panel{display:none;position:absolute;top:36px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border-light);border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.1);z-index:50;min-width:96px;padding:4px 0;}
  .more-op.open .more-op-panel{display:block;}
  .more-op .more-op-item{padding:8px 16px;font-size:13px;color:var(--text-regular);cursor:pointer;white-space:nowrap;}
  .more-op .more-op-item:hover{background:#f2f7ff;color:var(--primary);}

  /* ===================== 分页 ===================== */
  .pagination-container{margin-top:20px;display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:8px 0;font-size:13px;color:var(--text-regular);}
  .pg-total{font-size:13px;color:var(--text-regular);}
  .pg-sizes select{height:28px;border:1px solid var(--border-base);border-radius:4px;color:var(--text-regular);font-size:13px;padding:0 6px;background:#fff;cursor:pointer;}
  .pg-btn{min-width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;background:#f4f4f5;color:var(--text-regular);cursor:pointer;font-size:13px;padding:0 4px;}
  .pg-btn.active{background:var(--primary);color:#fff;}
  .pg-btn.disabled{cursor:not-allowed;color:var(--text-placeholder);}
  .pg-jumper input{width:40px;height:28px;border:1px solid var(--border-base);border-radius:4px;text-align:center;font-size:13px;}
</style>
</head>
<body>
<div class="layout-container">

  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="logo">
      <div class="logo-icon">智</div>
      <div class="logo-text">智慧车市</div>
    </div>
    <div class="menu">
      <div class="menu-item expanded">
        <span>车市管理</span>
        <span class="arrow">›</span>
      </div>
      <div class="submenu">
        <div class="submenu-item active">市场列表</div>
      </div>
      <div class="menu-item expanded">
        <span>库容管理</span>
        <span class="arrow">›</span>
      </div>
      <div class="submenu">
        <div class="submenu-item" onclick="location.href='../金融初始化/金融初始化.html'">金融初始化管理</div>
      </div>
    </div>
  </div>

  <!-- 右侧主体 -->
  <div class="main-area">
    <!-- 顶部状态栏 -->
    <div class="top-header">
      <div class="market-info">【泸州汽车交易市场】</div>
      <div class="user-profile">
        <div class="role-switcher">切换角色：超级管理员</div>
        <div class="avatar">王</div>
        <div class="username">王晓明</div>
        <div class="role-tag">超级管理员</div>
        <div class="dropdown-arrow">▾</div>
      </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
      <div class="content-body">

        <!-- 筛选条件区 -->
        <div class="search-filter-container">
          <div class="filter-row">
            <div class="filter-item">
              <span class="filter-label">市场名称</span>
              <input type="text" class="ipt" id="filterName" placeholder="请输入市场名称" style="width:200px;">
            </div>
            <div class="filter-item">
              <span class="filter-label">市场状态</span>
              <div class="custom-select" id="filterStatus" style="width:200px;">
                <div class="sel-display" data-value="">
                  <span class="sel-text">全部</span>
                  <span class="sel-arrow">▾</span>
                </div>
                <div class="select-panel">
                  <div class="select-option selected" data-value="">全部</div>
                  <div class="select-option" data-value="正常">正常</div>
                  <div class="select-option" data-value="停用">停用</div>
                </div>
              </div>
            </div>
            <div class="filter-item">
              <span class="filter-label">市场类型</span>
              <div class="custom-select" id="filterType" style="width:200px;">
                <div class="sel-display placeholder" data-value="">
                  <span class="sel-text">市场类型</span>
                  <span class="sel-arrow">▾</span>
                </div>
                <div class="select-panel">
                  <div class="select-option" data-value="">全部</div>
                  <div class="select-option" data-value="场内市场">场内市场</div>
                  <div class="select-option" data-value="场外市场">场外市场</div>
                </div>
              </div>
            </div>
            <div class="filter-item">
              <span class="filter-label">创建时间</span>
              <div class="date-range">
                <span class="date-range-icon">📅</span>
                <input type="text" placeholder="开始日期">
                <span class="date-range-sep">-</span>
                <input type="text" placeholder="结束日期">
              </div>
            </div>
          </div>
          <div class="filter-row" style="margin-top:16px;">
            <div class="filter-actions">
              <button class="btn btn-primary btn-large" id="btnSearch">查询</button>
              <button class="btn btn-large" id="btnReset">重置</button>
            </div>
          </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-wrap">
          <table class="data-table">
            <colgroup>
              <col style="width:90px;">
              <col style="width:160px;">
              <col style="width:140px;">
              <col>
              <col style="width:110px;">
              <col style="width:220px;">
              <col style="width:90px;">
              <col style="width:120px;">
              <col style="width:120px;">
            </colgroup>
            <thead>
              <tr>
                <th>市场id</th>
                <th>市场名称</th>
                <th>服务电话</th>
                <th>市场地址</th>
                <th>市场类型</th>
                <th>负责人信息</th>
                <th>市场状态</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="marketTableBody">
            </tbody>
          </table>
        </div>

        <!-- 分页 -->
        <div class="pagination-container">
          <span class="pg-total">共 <b id="pgTotal">0</b> 条</span>
          <span class="pg-sizes">
            <select id="pgSizeSelect">
              <option value="10">10条/页</option>
              <option value="20">20条/页</option>
              <option value="50">50条/页</option>
              <option value="100">100条/页</option>
            </select>
          </span>
          <span class="pg-btn disabled" id="pgPrev">‹</span>
          <span class="pg-btn active" id="pgNum">1</span>
          <span class="pg-btn disabled" id="pgNext">›</span>
          <span class="pg-jumper">前往 <input type="text" id="pgJumpInput" value="1"> 页</span>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
// ===================== Mock 数据 =====================
const markets = [
  { id: '52a', name: '泸州汽车交易市场', phone: '0830-8888888', address: '四川省泸州市江阳区国窖大道88号泸州汽车交易市场', type: '场内市场', owner: '王晓明', ownerPhone: '0830-8888888', status: '正常', created: '2026-05-26' },
  { id: 'c48', name: '银地汽车出口', phone: '15852386068', address: '江苏省徐州市贾汪区金龙湖街道城东快速路88号银地二手车交易市场', type: '场外市场', owner: '刘总', ownerPhone: '15852386068', status: '正常', created: '2026-05-19' },
  { id: '6c4', name: '文昌利星二手车市场', phone: '0898-63265288', address: '海南省文昌市文城镇城南村委会下田村文昌日之星丰田汽车销售服务有限公司一层', type: '场内市场', owner: '纪总', ownerPhone: '0898-63265288', status: '正常', created: '2026-04-30' },
  { id: 'e5b', name: '中国(广州琶洲)汽车出口基地', phone: '13308350550', address: '广东省广州市海珠区琶洲街道新港东路30号琶洲岛', type: '场外市场', owner: '侯云', ownerPhone: '13308350550', status: '正常', created: '2026-04-23' },
  { id: '4a8', name: '广东中山鸿源二手车市场', phone: '13822727392', address: '广东省中山市西区街道中山市公安局交警支队车管所鸿源机动车登记服务壹加壹彩虹里', type: '场外市场', owner: '甘总', ownerPhone: '13822727392', status: '正常', created: '2026-04-14' },
  { id: '239', name: '上海车王二手车市场', phone: '13661868888', address: '上海市浦东新区惠南镇五角兴农城', type: '场内市场', owner: '许征', ownerPhone: '13661868888', status: '正常', created: '2026-04-09' },
  { id: 'd3b', name: '陕西车坛二弟汽车销售有限公司', phone: '18192892136', address: '陕西省西安市未央区三桥街道天台三路车坛老王品牌二手车', type: '场外市场', owner: '车坛二弟汽车', ownerPhone: '18192892136', status: '正常', created: '2026-03-25' }
];

let filtered = [...markets];

// ===================== 渲染 =====================
function renderTable() {
  document.getElementById('pgTotal').textContent = filtered.length;
  document.getElementById('marketTableBody').innerHTML = filtered.length === 0
    ? `<tr><td colspan="9" style="text-align:center;color:#909399;padding:40px 0;">暂无数据</td></tr>`
    : filtered.map(m => `
    <tr>
      <td>${m.id}</td>
      <td>${m.name}</td>
      <td>${m.phone}</td>
      <td style="text-align:left;white-space:normal;word-break:break-all;">${m.address}</td>
      <td>${m.type}</td>
      <td>负责人姓名:${m.owner}<br>负责人电话:${m.ownerPhone}</td>
      <td><span class="status-tag ${m.status === '正常' ? 'success' : 'info'}">${m.status}</span></td>
      <td>${m.created}</td>
      <td>
        <div class="market-op-btns">
          <button class="btn btn-small btn-primary" onclick="openMarketEdit('${m.id}')">编辑</button>
          <div class="more-op">
            <button class="more-op-btn" onclick="toggleMoreOp(this, event)">更多操作 <span style="font-size:10px;">▾</span></button>
            <div class="more-op-panel">
              <div class="more-op-item" onclick="toggleStatus('${m.id}')">${m.status === '正常' ? '停用' : '启用'}</div>
            </div>
          </div>
        </div>
      </td>
    </tr>
  `).join('');
}

// ===================== 筛选 =====================
document.getElementById('btnSearch').addEventListener('click', () => {
  const name = document.getElementById('filterName').value.trim();
  const status = document.querySelector('#filterStatus .sel-display').getAttribute('data-value');
  const type = document.querySelector('#filterType .sel-display').getAttribute('data-value');
  filtered = markets.filter(m => {
    if (name && !m.name.includes(name)) return false;
    if (status && m.status !== status) return false;
    if (type && m.type !== type) return false;
    return true;
  });
  renderTable();
});

document.getElementById('btnReset').addEventListener('click', () => {
  document.getElementById('filterName').value = '';
  setSelectValue('filterStatus', '', '全部');
  document.querySelector('#filterStatus .sel-display').classList.remove('placeholder');
  setSelectValue('filterType', '', '市场类型');
  document.querySelector('#filterType .sel-display').classList.add('placeholder');
  filtered = [...markets];
  renderTable();
});

// ===================== 更多操作 =====================
function toggleMoreOp(btn, e) {
  e.stopPropagation();
  const wrap = btn.parentElement;
  const isOpen = wrap.classList.contains('open');
  document.querySelectorAll('.more-op.open').forEach(el => el.classList.remove('open'));
  if (!isOpen) wrap.classList.add('open');
}
document.addEventListener('click', () => {
  document.querySelectorAll('.more-op.open').forEach(el => el.classList.remove('open'));
});

function toggleStatus(id) {
  const m = markets.find(x => x.id === id);
  if (m) m.status = m.status === '正常' ? '停用' : '正常';
  filtered = filtered.map(x => x.id === id ? m : x);
  renderTable();
}

function openMarketEdit(id) {
  location.href = '../index.html#editMarket=' + id;
}

// ===================== 下拉选择 =====================
function setSelectValue(id, value, label) {
  const el = document.getElementById(id);
  const display = el.querySelector('.sel-display');
  display.setAttribute('data-value', value);
  display.querySelector('.sel-text').textContent = label;
  el.querySelectorAll('.select-option').forEach(o => o.classList.toggle('selected', o.getAttribute('data-value') === value));
}

document.querySelectorAll('.custom-select').forEach(sel => {
  const display = sel.querySelector('.sel-display');
  const panel = sel.querySelector('.select-panel');
  if (!panel) return;
  display.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.custom-select.open').forEach(o => { if (o !== sel) o.classList.remove('open'); });
    sel.classList.toggle('open');
  });
  panel.querySelectorAll('.select-option').forEach(opt => {
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      const v = opt.getAttribute('data-value');
      const label = opt.textContent.trim();
      setSelectValue(sel.id, v, label);
      sel.classList.remove('open');
      if (v === '') {
        display.classList.add('placeholder');
      } else {
        display.classList.remove('placeholder');
      }
    });
  });
});
document.addEventListener('click', () => {
  document.querySelectorAll('.custom-select.open').forEach(o => o.classList.remove('open'));
});

// ===================== 初始化 =====================
renderTable();
</script>
</body>
